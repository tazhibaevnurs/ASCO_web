# Фрагмент для nginx (внутри server { }). Подстройте под корень проекта и HTTPS.

# Статика: долгий кэш + immutable (имена с хешем / версией в query)
location ~* \.(webp|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
}

location ~* \.(css|js)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
}

# HTML от Django — не кэшировать агрессивно у CDN
location ~* \.(html|php)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
