<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Сброс пароля — ASCO.KG</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#222;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f5;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="padding:28px 28px 8px;font-size:22px;font-weight:700;">ASCO.KG</td>
          </tr>
          <tr>
            <td style="padding:8px 28px 0;font-size:16px;line-height:1.5;">
              Здравствуйте,<br><br>
              Вы запросили сброс пароля на сайте ASCO.KG.
            </td>
          </tr>
          <tr>
            <td style="padding:24px 28px;">
              <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
                 style="display:inline-block;background:#0d6efd;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:6px;font-size:15px;font-weight:600;">
                Задать новый пароль
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 28px;font-size:13px;line-height:1.5;color:#666;">
              Ссылка действует ограниченное время. Если вы не запрашивали сброс пароля, проигнорируйте это письмо.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
