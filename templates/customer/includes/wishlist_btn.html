{% comment %}
Кнопка «Избранное» для карточки товара. Переменные: product, is_in_wishlist (bool).
Используется и при первой отрисовке, и в HTMX-ответе (после toggle).
{% endcomment %}
<button
    type="button"
    class="wishlist-btn tw-p-2 tw-rounded-lg tw-text-gray-400 hover:tw-text-[#EB332C] tw-transition-transform active:tw-scale-125 focus:tw-outline-none focus:tw-ring-0"
    aria-label="{% if is_in_wishlist %}Удалить из избранного{% else %}Добавить в избранное{% endif %}"
    hx-post="{% url 'customer:toggle_wishlist' product.id %}"
    hx-trigger="click"
    hx-swap="outerHTML"
    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
    onclick="event.preventDefault(); event.stopPropagation();"
>
    {% if is_in_wishlist %}
        <i class="fas fa-heart tw-text-[#EB332C]" aria-hidden="true"></i>
    {% else %}
        {# outline heart без fa-regular — меньше шрифтового CSS на витрине #}
        <svg class="tw-w-5 tw-h-5 tw-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    {% endif %}
</button>
